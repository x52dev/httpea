name: Coverage

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov,just
        uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-llvm-cov,just

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Enter Nix devshell
        uses: nicknovitski/nix-develop@v1.2.1
        with:
          arguments: .#ci

      - name: Generate code coverage
        run: just test-coverage-codecov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          files: codecov.json
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
